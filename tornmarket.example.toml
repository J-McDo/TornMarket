# Copy to tornmarket.toml and edit. TORN_API_KEY / TORN_DISCORD_WEBHOOK env vars override these.
api_key = ""                 # Torn API key; "Limited" access lets the bot read your portfolio
db_path = "tornmarket.db"
poll_seconds = 60            # how often to snapshot the market
max_calls_per_minute = 60    # Torn allows 100/min per user across ALL your keys and tools
discord_webhook = ""         # optional: post signals to a Discord channel
watchlist = []               # e.g. ["TSB", "TCI", "FHG"]; empty = every stock (held stocks always included)

[strategy]
bar_seconds = 900            # indicators run on 15-minute bars built from the snapshots
ema_fast = 12
ema_slow = 26
macd_signal = 9
sma_trend = 50
rsi_period = 14
rsi_oversold = 30
rsi_overbought = 70
bb_period = 20
bb_width = 2.0
roc_period = 10
buy_threshold = 3.0
sell_threshold = -3.0
stop_loss_pct = 8.0
take_profit_pct = 15.0
trailing_stop_pct = 6.0
sell_fee_pct = 0.1
protect_benefit_blocks = true
