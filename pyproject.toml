[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tornmarket"
version = "0.1.0"
description = "Torn City stock market harvester and buy/sell signal bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tornmarket = "tornmarket.cli:main"

[tool.setuptools]
packages = ["tornmarket"]
